name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Save build error to repository
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "JARVIS Android Build Error"
            echo "================================"
            echo ""
            tail -150 build.log
          } > build-error.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build-error.txt
          git commit -m "Build error report"
          git push

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis Latest Build
          files: app/build/outputs/apk/debug/app-debug.apk
